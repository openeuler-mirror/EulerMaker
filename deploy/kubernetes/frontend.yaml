apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ebs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ebs
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/ebs-control-plane: ""
      containers:
        - name: frontend
          image: swr.cn-north-4.myhuaweicloud.com/eulermaker/frontend:dev
          imagePullPolicy: Always
          env:
            - name: DEFAULT_ARTIFACT_MANAGER
              value: artifact-manager.art-01:8081
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
