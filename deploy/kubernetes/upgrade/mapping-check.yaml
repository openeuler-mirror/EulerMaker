apiVersion: batch/v1
kind: Job
metadata:
  generateName: ebs-mapping-check-
  namespace: ebs
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebs-mapping-check
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/ebs-control-plane: ""
      containers:
        - name: mapping-check
          # Use the same target image digest for check, apply and the Deployment.
          image: swr.cn-north-4.myhuaweicloud.com/eulermaker/ebs-apiserver:dev
          imagePullPolicy: Always
          env:
            - name: SSL_CERT_FILE
              value: /etc/ebs/es/ca.crt
          command: ["/bin/sh", "-c"]
          args:
            - |
              result=0
              "$@" || result=$?
              echo "mapping check exit code: $result"
              case "$result" in
                0) echo "Mapping check passed: no additions." ;;
                2) echo "Mapping check passed: review additions before running apply." ;;
                *) exit "$result" ;;
              esac
            - mapping-check
            - /app/ebs-apiserver
            - mapping
            - --es-servers=https://elasticsearch:9200
            - --es-api-key-file=/etc/ebs/es/api-key
          volumeMounts:
            - name: es-auth
              mountPath: /etc/ebs/es
              readOnly: true
      volumes:
        - name: es-auth
          secret:
            secretName: ebs-apiserver-es-auth
