apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: ebs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: git
      port: 9418
      targetPort: git
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-server-data
  namespace: ebs
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ebs-disk-ssd-retain
  resources:
    requests:
      storage: 1Ti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: ebs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: true
      nodeSelector:
        node-role.kubernetes.io/ebs-control-plane: ""
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: git-server
          image: swr.cn-north-4.myhuaweicloud.com/eulermaker/git-server:dev
          imagePullPolicy: Always
          args:
            - --listen-address=:8080
            - --data-dir=/var/lib/ebs-git
            - --git-daemon-address=:9418
            - --clone-base-url=git://$(GIT_SERVER_SERVICE_HOST):9418
          ports:
            - name: http
              containerPort: 8080
            - name: git
              containerPort: 9418
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/ebs-git
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: git-server-data
