apiVersion: v1
kind: Service
metadata:
  name: artifact-manager
  namespace: ebs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: artifact-manager
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-manager
  namespace: ebs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: artifact-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifact-manager
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/artifact: ""
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: artifact-manager
          image: swr.cn-north-4.myhuaweicloud.com/eulermaker/artifact-manager:dev
          imagePullPolicy: Always
          args:
            - --listen=:8081
            - --data-dir=/var/lib/ebs-artifacts
            - --gateway-url=http://ebs-gateway:8080
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/ebs-artifacts
      volumes:
        - name: data
          hostPath:
            path: /srv/artifacts
            type: Directory
