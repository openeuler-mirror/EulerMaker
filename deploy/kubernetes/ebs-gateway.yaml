apiVersion: v1
kind: Service
metadata:
  name: ebs-gateway
  namespace: ebs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ebs-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebs-gateway
  namespace: ebs
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ebs-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebs-gateway
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/ebs-control-plane: ""
      containers:
        - name: ebs-gateway
          image: swr.cn-north-4.myhuaweicloud.com/eulermaker/ebs-gateway:dev
          imagePullPolicy: Always
          args:
            - --apiserver-addr=https://ebs-apiserver:8443
            - --apiserver-ca=/etc/ebs/apiserver/ca.crt
            - --apiserver-client-cert=/etc/ebs/apiserver/tls.crt
            - --apiserver-client-key=/etc/ebs/apiserver/tls.key
            - --jwt-secret-file=/etc/ebs/jwt/secret
            - --rate-limit-per-sec=100
            - --rate-limit-burst=200
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: apiserver-tls
              mountPath: /etc/ebs/apiserver
              readOnly: true
            - name: jwt-secret
              mountPath: /etc/ebs/jwt
              readOnly: true
      volumes:
        - name: apiserver-tls
          secret:
            secretName: ebs-gateway-apiserver-tls
        - name: jwt-secret
          secret:
            secretName: ebs-gateway-jwt
