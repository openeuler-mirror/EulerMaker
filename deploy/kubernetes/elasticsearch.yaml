apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: ebs
data:
  elasticsearch.yml: |
    cluster.name: eulermaker
    network.host: 0.0.0.0
    discovery.seed_hosts: [elasticsearch-headless]
    xpack.security.enabled: true
    xpack.security.autoconfiguration.enabled: false
    xpack.security.transport.ssl.enabled: true
    xpack.security.transport.ssl.verification_mode: certificate
    xpack.security.transport.ssl.client_authentication: required
    xpack.security.transport.ssl.certificate_authorities: [/usr/share/elasticsearch/config/certs/transport/ca.crt]
    xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/certs/transport/tls.crt
    xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/certs/transport/tls.key
    xpack.security.http.ssl.enabled: true
    xpack.security.http.ssl.certificate_authorities: [/usr/share/elasticsearch/config/certs/http/ca.crt]
    xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/http/tls.crt
    xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/http/tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: ebs
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
    - name: transport
      port: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: ebs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: ebs
spec:
  serviceName: elasticsearch-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        node-role.kubernetes.io/elasticsearch: ""
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: elasticsearch
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: elasticsearch
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
          imagePullPolicy: IfNotPresent
          env:
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The optional ConfigMap exists only during first cluster bootstrap.
            - name: cluster.initial_master_nodes
              valueFrom:
                configMapKeyRef:
                  name: elasticsearch-bootstrap
                  key: initialMasterNodes
                  optional: true
            - name: ES_JAVA_OPTS
              value: -Xms2g -Xmx2g
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true
            - name: transport-tls
              mountPath: /usr/share/elasticsearch/config/certs/transport
              readOnly: true
            - name: http-tls
              mountPath: /usr/share/elasticsearch/config/certs/http
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: elasticsearch-config
        - name: transport-tls
          secret:
            secretName: elasticsearch-transport-tls
            defaultMode: 0440
        - name: http-tls
          secret:
            secretName: elasticsearch-http-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ebs-disk-ssd-retain
        resources:
          requests:
            storage: 1Ti
