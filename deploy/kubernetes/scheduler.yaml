apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: ebs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scheduler
  ports:
    - name: health
      port: 8080
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: ebs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/ebs-control-plane: ""
      containers:
        - name: scheduler
          image: swr.cn-north-4.myhuaweicloud.com/eulermaker/scheduler:dev
          imagePullPolicy: Always
          args:
            - --apiserver=https://ebs-apiserver:8443
            - --apiserver-ca=/etc/ebs/apiserver/ca.crt
            - --apiserver-client-cert=/etc/ebs/apiserver/tls.crt
            - --apiserver-client-key=/etc/ebs/apiserver/tls.key
          ports:
            - name: health
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          volumeMounts:
            - name: apiserver-tls
              mountPath: /etc/ebs/apiserver
              readOnly: true
      volumes:
        - name: apiserver-tls
          secret:
            secretName: scheduler-apiserver-tls
