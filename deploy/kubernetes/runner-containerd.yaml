apiVersion: v1
kind: Namespace
metadata:
  name: ebs-node
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebs-runner
  namespace: ebs-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ebs-runner
  # Update nodes manually after draining their EulerMaker Jobs.
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebs-runner
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/ebs-runner: ""
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 60
      containers:
        - name: ebs-runner
          image: swr.cn-north-4.myhuaweicloud.com/eulermaker/runner:dev
          imagePullPolicy: Always
          args:
            - --gateway=http://ebs-gateway.ebs.svc.cluster.local:8080
            - --machine-credential-file=/etc/ebs/runner/credential.json
            - --name=$(POD_NAME)
            - --type=ct
            - --service-access-mode=internal
            - --container-runtime=containerd
            - --containerd-address=/run/containerd/containerd.sock
            # Do not share kubelet's k8s.io namespace.
            - --containerd-namespace=eulermaker
            - --containerd-snapshotter=overlayfs
            - --root-dir=/var/lib/ebs-runner
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            # The host runtime socket and Job output directories are root-owned.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          # These requests cover the agent, not the host-side build containers.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: containerd-socket
              mountPath: /run/containerd/containerd.sock
            # The Go client reads image users/groups from host snapshots when creating the OCI spec.
            - name: containerd-snapshots
              mountPath: /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs
              readOnly: true
            # containerd resolves bind mounts and log paths on the host.
            - name: runner-data
              mountPath: /var/lib/ebs-runner
            - name: machine-credential
              mountPath: /etc/ebs/runner
              readOnly: true
      volumes:
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: containerd-snapshots
          hostPath:
            path: /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs
            type: Directory
        - name: runner-data
          hostPath:
            path: /var/lib/ebs-runner
            type: DirectoryOrCreate
        - name: machine-credential
          secret:
            secretName: ebs-runner-machine-credential
            defaultMode: 0400
            items:
              - key: credential.json
                path: credential.json
