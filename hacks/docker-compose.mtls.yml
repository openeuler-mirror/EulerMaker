services:
  ebs-apiserver:
    command:
      - --etcd-servers=http://etcd:2379
      - --es-servers=http://elasticsearch:9200
      - --enable-iam=true
      - --tls-cert-file=/run/ebs-certs/ebs-apiserver.crt
      - --tls-private-key-file=/run/secrets/ebs_apiserver_key
      - --internal-client-ca-file=/run/ebs-certs/client-ca.crt
    volumes:
      - ./certs/runtime/ebs-apiserver.crt:/run/ebs-certs/ebs-apiserver.crt:ro
      - ./certs/runtime/client-ca.crt:/run/ebs-certs/client-ca.crt:ro
    secrets:
      - ebs_apiserver_key

  ebs-gateway:
    command:
      - --apiserver-addr=https://ebs-apiserver:8443
      - --jwt-secret-file=/run/secrets/ebs_gateway_jwt_secret
      - --apiserver-ca=/run/ebs-certs/server-ca.crt
      - --apiserver-client-cert=/run/ebs-certs/ebs-gateway.crt
      - --apiserver-client-key=/run/secrets/ebs_gateway_client_key
      - --rate-limit-per-sec=100
      - --rate-limit-burst=200
    volumes:
      - ./certs/runtime/server-ca.crt:/run/ebs-certs/server-ca.crt:ro
      - ./certs/runtime/ebs-gateway.crt:/run/ebs-certs/ebs-gateway.crt:ro
    secrets:
      - ebs_gateway_jwt_secret
      - ebs_gateway_client_key

  scheduler:
    command:
      - --apiserver=https://ebs-apiserver:8443
      - --apiserver-ca=/run/ebs-certs/server-ca.crt
      - --apiserver-client-cert=/run/ebs-certs/scheduler.crt
      - --apiserver-client-key=/run/secrets/scheduler_client_key
    volumes:
      - ./certs/runtime/server-ca.crt:/run/ebs-certs/server-ca.crt:ro
      - ./certs/runtime/scheduler.crt:/run/ebs-certs/scheduler.crt:ro
    secrets:
      - scheduler_client_key

  controller-manager:
    command:
      - --apiserver=https://ebs-apiserver:8443
      - --apiserver-ca=/run/ebs-certs/server-ca.crt
      - --apiserver-client-cert=/run/ebs-certs/controller-manager.crt
      - --apiserver-client-key=/run/secrets/controller_manager_client_key
      - --git-server-addr=http://git-server:8080
      - --artifact-manager-addr=http://${EXPORT_SERVER_ADDR:-artifact-manager}:8081
    volumes:
      - ./certs/runtime/server-ca.crt:/run/ebs-certs/server-ca.crt:ro
      - ./certs/runtime/controller-manager.crt:/run/ebs-certs/controller-manager.crt:ro
    secrets:
      - controller_manager_client_key

secrets:
  ebs_apiserver_key:
    file: ./certs/runtime/ebs-apiserver.key
  ebs_gateway_client_key:
    file: ./certs/runtime/ebs-gateway.key
  scheduler_client_key:
    file: ./certs/runtime/scheduler.key
  controller_manager_client_key:
    file: ./certs/runtime/controller-manager.key
