services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-token=ebs-cluster
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - ebs-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ebs-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 10
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  ebs-apiserver:
    build:
      context: ..
      dockerfile: components/ebs-apiserver/Dockerfile
    command:
      - --etcd-servers=http://etcd:2379
      - --es-servers=http://elasticsearch:9200
      - --enable-iam=true
    ports:
      - "8443:8443"
    networks:
      - ebs-net
    depends_on:
      etcd:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  ebs-gateway:
    build:
      context: ../components/ebs-gateway
    command:
      - --apiserver-addr=https://ebs-apiserver:8443
      - --jwt-secret-file=/run/secrets/ebs_gateway_jwt_secret
      - --insecure-skip-verify=true
      - --rate-limit-per-sec=100
      - --rate-limit-burst=200
    secrets:
      - ebs_gateway_jwt_secret
    ports:
      - "8080:8080"
    networks:
      - ebs-net
    depends_on:
      - ebs-apiserver

  artifact-manager:
    build:
      context: ../components/artifact-manager
    command:
      - --listen=:8081
      - --data-dir=/var/lib/ebs-artifacts
      - --gateway-url=http://ebs-gateway:8080
    ports:
      - "8081:8081"
    volumes:
      - artifact-data:/var/lib/ebs-artifacts
    networks:
      - ebs-net
    depends_on:
      - ebs-gateway

  ebs-runner:
    build:
      context: ../components/runner
    command:
      - --gateway=http://ebs-gateway:8080
      - --artifact-manager=http://artifact-manager:8081
      - --machine-credential-file=/run/secrets/runner_machine_credential
      - --name=runner-ct-01
      - --type=ct
      - --root-dir=/var/lib/ebs-runner
    secrets:
      - runner_machine_credential
    group_add:
      - "${DOCKER_GID:-989}"
    volumes:
      - /usr/bin/docker:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker mounts are resolved by the host daemon. Keep the runner data
      # root at the same absolute path on both the host and runner container so
      # Job containers can mount work/results and the runner can upload them.
      - /var/lib/ebs-runner:/var/lib/ebs-runner
    networks:
      - ebs-net
    depends_on:
      - ebs-gateway
      - artifact-manager

networks:
  ebs-net:
    driver: bridge

volumes:
  etcd-data:
  es-data:
  artifact-data:

secrets:
  ebs_gateway_jwt_secret:
    file: ./ebs-gateway-jwt-secret
  runner_machine_credential:
    file: ./runner-machine-credential.json
